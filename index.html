       :root {
    /* ================================
       DARKNOVAX RED / BLACK THEME
       ================================ */

    --bg-color1: #000000;
    --bg-color2: #050000;
    --bg-color3: #080000;

    /* Transparent red glass */
    --glass-bg: rgba(35, 0, 0, 0.38);
    --glass-border: rgba(255, 30, 30, 0.18);

    --glass-shadow:
        0 8px 32px rgba(0, 0, 0, 0.65),
        0 0 30px rgba(255, 0, 0, 0.04);

    /* Main red accent */
    --accent: #ff1717;
    --accent-red: #ff1717;
    --accent-red-soft: rgba(255, 23, 23, 0.18);

    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);

    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --sidebar-width: 320px;
}

body {
    background: #000000;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    color: var(--text);

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.28;
    z-index: -1;
    animation: floatOrb 20s infinite ease-in-out alternate;
    pointer-events: none;
}

.orb-1 {
    width: 430px;
    height: 430px;
    background: #ff0000;
    top: -140px;
    left: -140px;
}

.orb-2 {
    width: 520px;
    height: 520px;
    background: #ff0000;
    bottom: -240px;
    right: -140px;
    animation-delay: -5s;
}

@keyframes floatOrb {
    0% {
        transform: translate(0, 0) scale(1);
    }

    100% {
        transform: translate(45px, 45px) scale(1.15);
    }
}        
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }

        /* SPLASH SCREEN - Now with Glassmorphism */
        #splash { 
            position: fixed; inset: 0; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.8s, visibility 0.8s; 
            background: rgba(10, 10, 15, 0.4);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
        }
        /* Adjusted splash logo animation to just be a quick fade-in/pop, no endless floating */
        .splash-logo { width: 100px; height: 100px; color: white; animation: logo-intro 1s var(--spring) forwards; opacity: 0; }
        @keyframes logo-intro { 
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); } 
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 15px white); } 
        }
        #mic-trigger.recording { color: #ff3b30; animation: mic-pulse 1.2s ease-in-out infinite; }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.5); }
            50% { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
        }

        /* Skeleton Loader */
        .skeleton-box {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%);
            background-size: 200% 100%;
            animation: loadingSkeleton 1.5s infinite;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes loadingSkeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* SIDEBAR */
        #sidebar {
            width: var(--sidebar-width); height: 100%; 
            display: flex; flex-direction: column; 
            transition: transform 0.6s var(--spring); z-index: 1000;
            border-right: 1px solid var(--glass-border);
        }
        body.sidebar-closed #sidebar { transform: translateX(-100%); position: absolute; }
        
        .sidebar-header { padding: 25px; display: flex; justify-content: space-between; align-items: center; }
        .search-bar {
            margin: 0 20px 15px; padding: 12px 15px; border-radius: 12px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: white; outline: none; font-size: 0.9rem;
        }
        .search-bar::placeholder { color: var(--text-muted); }

        #history-list { flex: 1; overflow-y: auto; padding: 0 15px 15px; }
        .history-item { 
            padding: 14px; margin-bottom: 8px; border-radius: 14px; 
            font-size: 0.85rem; cursor: pointer; display: flex; justify-content: space-between; 
            transition: all 0.3s var(--spring);
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
        }
        .history-item:hover { background: rgba(255,255,255,0.08); border-color: var(--glass-border); transform: translateX(5px); }
        .history-item.active { background: rgba(255,255,255,0.15); border-color: var(--glass-border); color: #fff; font-weight: 600; }
        .delete-btn { opacity: 0.5; transition: 0.2s; }
        .delete-btn:hover { opacity: 1; color: #ff3b30; }

        /* MAIN CHAT AREA */
        main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { 
            height: 70px; padding: 0 20px; display: flex; align-items: center; 
            justify-content: space-between; border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }
        
        #chat-window { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 25px; scroll-behavior: smooth; }

        /* Messages */
        .msg { 
            max-width: 85%; padding: 18px 24px; border-radius: 24px; font-size: 0.95rem;

        }
        
        .msg-user {

        }
        
        .msg-actions {

        }
        .msg-bot:hover .msg-actions { opacity: 1; }
        .action-icon {
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            padding: 5px; border-radius: 8px; cursor: pointer; color: white; display: grid; place-items: center;
            transition: 0.2s; backdrop-filter: blur(5px);
        }
        .action-icon:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        @keyframes msgSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Typography & Markdown */
        strong, b { font-weight: 800; color: inherit; }
        p { margin-bottom: 10px; }
        p:last-child { margin-bottom: 0; }
        
        /* Universal styling for AI generated images */
        .msg img {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid var(--glass-border);
            display: block;
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%);
            background-size: 200% 100%;
            animation: loadingSkeleton 1.5s infinite;
            cursor: pointer;
            color: transparent;
            transition: transform 0.3s var(--spring), box-shadow 0.3s;
        }
        .msg img:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(255,255,255,0.1); }

        /* Lightbox */
        #lightbox {
            position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        #lightbox.active { display: flex; opacity: 1; }
        #lightbox img { max-width: 90%; max-height: 85vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .lightbox-controls { position: absolute; top: 25px; right: 25px; display: flex; gap: 15px; }
        .lightbox-btn { 
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: white;
            width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
            transition: 0.2s; backdrop-filter: blur(5px);
        }
        .lightbox-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }

        /* Code Blocks */
        .code-wrapper { position: relative; margin: 15px 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;

        }
        .copy-btn {

        }
        .copy-btn:hover { color: white; }
        pre { background: rgba(0,0,0,0.4) !important; padding: 15px; margin: 0; overflow-x: auto; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 14px; }

        /* Loading Animation */
        .typing { display: flex; align-items: center; gap: 6px; padding: 10px 5px; }
        .typing span { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: typingBounce 1.4s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

        /* INPUT AREA */
        .input-wrap { padding: 20px; position: relative; z-index: 10; }
        .input-pill { 
            max-width: 850px; margin: 0 auto; padding: 8px 8px 8px 20px; 
            border-radius: 40px; display: flex; align-items: center; gap: 12px; 
        }
        #user-input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 1.05rem; padding: 12px 0; }
        #user-input::placeholder { color: var(--text-muted); }
        
        .circle-btn { 
            background: var(--accent); color: #000; border: none; width: 48px; height: 48px; 
            border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: 0.3s var(--spring);
        }
        .circle-btn:hover { transform: scale(1.08); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        .icon-btn { background: none; border: none; color: var(--text); cursor: pointer; opacity: 0.6; transition: 0.2s; display: grid; place-items: center; padding: 8px; border-radius: 50%; }
        .icon-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

        #file-chip {
            display: none; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white;

            width: fit-content; margin: 0 auto 15px; animation: msgSlide 0.3s;
        }

        /* SETTINGS MODAL */
        #settings-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: 0.4s;
        }
        #settings-overlay.active { display: flex; opacity: 1; }
        
        .settings-card { 
            width: 90%; max-width: 500px; padding: 30px; border-radius: 24px;
            display: flex; flex-direction: column; gap: 18px; position: relative;
        }
        .setting-row { background: rgba(0,0,0,0.3); padding: 18px 20px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--glass-border); }
        
        select.glass-select {

        /* Switches */
        .switch { width: 50px; height: 26px; position: relative; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: rgba(255,255,255,0.1); border-radius: 34px; cursor: pointer; transition: 0.4s; border: 1px solid var(--glass-border); }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: 0.4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        input:checked + .slider { background: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); background: #000; }

        .btn-danger:hover { background: rgba(255, 59, 48, 0.4); }

    body {
        display: flex;
        flex-direction: row;
    }

    /* Sidebar */
    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: min(85vw, 320px);
        height: 100dvh;
        transform: translateX(-100%);
        z-index: 1000;
    }

    body.sidebar-open #sidebar {
        transform: translateX(0);
    }

    .hide-mobile {
        display: none !important;
    }

    /* Main area */
    main {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        flex: 1 1 100%;
    }

    /* Header */
    header {
        width: 100%;
        height: 60px;
        min-height: 60px;
        padding: 0 10px;
        gap: 8px;
    }

    header > div {
        min-width: 0;
    }

    /* Chat */
    #chat-window {
        width: 100%;
        min-width: 0;
        padding: 20px 12px;
        gap: 20px;
        overflow-x: hidden;
    }

    /* Messages */
    .msg {
        max-width: 92%;
        min-width: 0;
        padding: 14px 17px;
        font-size: 0.92rem;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .msg pre {
        max-width: 100%;
        overflow-x: auto;
    }

    .msg code {
        font-size: 12px;
    }

    /* Welcome screen */
    #welcome-screen {
        width: 100%;
        max-width: 100%;
        padding: 20px 10px;
        box-sizing: border-box;
    }

    #welcome-screen h1 {
        font-size: 2rem !important;
    }

    .welcome-description {
        width: 100%;
        max-width: 100%;
        padding: 0 8px;
        font-size: 0.95rem;
    }

    /* Welcome buttons */
    #welcome-screen > div:last-child {
        width: 100% !important;
        max-width: 100%;
        grid-template-columns: 1fr !important;
    }

    /* Input */
    .input-wrap {
        width: 100%;
        padding: 10px;
    }

    .input-pill {
        width: 100%;
        max-width: 100%;
        padding: 6px 7px 6px 12px;
        gap: 5px;
    }

    #user-input {
        min-width: 0;
        width: 100%;
        font-size: 0.95rem;
    }

    .circle-btn {
        width: 44px;
        height: 44px;
        min-width: 44px;
    }

    .icon-btn {
        padding: 6px;
        flex-shrink: 0;
    }

    /* Web results */
    .web-results {
        width: 100%;
        max-width: 100%;
    }

    .web-result {
        padding: 13px;
    }

    .web-result-top {
        gap: 8px;
    }

    /* Settings */
    .settings-card {
        width: calc(100% - 24px);
        max-width: none;
        max-height: 90dvh;
        overflow-y: auto;
        padding: 20px;
    }

    .setting-row {
        gap: 12px;
        padding: 15px;
    }

    .setting-row > span {
        min-width: 0;
        overflow-wrap: anywhere;
    }

    /* Images */
    .msg img {
        max-width: 100%;
        height: auto;
    }

    /* Prevent long URLs/text from breaking the page */
    a,
    p,
    span,
    div {
        overflow-wrap: anywhere;
    }

    /* Background orbs */
    .orb-1 {
        width: 250px;
        height: 250px;
    }

    .orb-2 {
        width: 300px;
        height: 300px;
    }
}

/* Extra-small phones */
@media (max-width: 400px) {

    header {
        padding: 0 7px;
    }

    #chat-window {
        padding: 15px 8px;
    }

    .msg {
        max-width: 95%;
        padding: 12px 14px;
    }

    .input-wrap {
        padding: 7px;
    }

    .input-pill {
        padding-left: 8px;
    }

    .circle-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
    }

    #welcome-screen h1 {
        font-size: 1.75rem !important;
    }
}

        /* =========================================================
   DARKNOVAX FINAL UI OVERRIDES
   BLACK + RED GLASS
   ========================================================= */

/* ---------------------------------------------------------
   1. FORCE ALL NORMAL TEXT TO WHITE
   --------------------------------------------------------- */

body,
main,
header,
button,
input,
textarea,
select,
label,
p,
span,
div {
    color: #ffffff;
}

/* Keep muted text slightly dim, but NEVER black */
#user-input::placeholder,
.search-bar::placeholder {
    color: rgba(255, 255, 255, 0.60);
}

/* ---------------------------------------------------------
   2. USER MESSAGES — WHITE TEXT
   --------------------------------------------------------- */

.msg-user {
    background: rgba(35, 0, 0, 0.45);
    color: #ffffff !important;
    border: 1px solid rgba(255, 20, 20, 0.45);
    box-shadow: none;
}

/* ---------------------------------------------------------
   3. BOT MESSAGES — WHITE TEXT
   --------------------------------------------------------- */

.msg-bot {
    color: #ffffff !important;
}

/* ---------------------------------------------------------
   4. SEND BUTTON — WHITE
   --------------------------------------------------------- */

.circle-btn {
    background: #ffffff !important;
    color: #000000 !important;

    border: 1px solid rgba(255, 255, 255, 0.9);

    box-shadow: none !important;

    transition: none !important;
}

/* Keep it WHITE when mouse is over it */
.circle-btn:hover,
.circle-btn:focus,
.circle-btn:active {
    background: #ffffff !important;
    color: #000000 !important;

    transform: none !important;
    box-shadow: none !important;
}

/* SVG inside send button */
.circle-btn svg {
    color: #000000 !important;
    stroke: #000000 !important;
}

/* ---------------------------------------------------------
   5. REMOVE HOVER COLOR CHANGES
   --------------------------------------------------------- */

/* Main buttons */
button:hover,
button:focus {
    color: inherit;
}

/* Glass elements */
.glass:hover {
    background: var(--glass-bg) !important;
    border-color: var(--glass-border) !important;
}

/* History items */
.history-item:hover {
    background: rgba(255, 255, 255, 0.02) !important;
    border-color: transparent !important;
    transform: none !important;
}

/* Action buttons */
.action-icon:hover {
    background: rgba(255, 255, 255, 0.10) !important;
    color: #ffffff !important;
    transform: none !important;
}

/* Header/icon buttons */
.icon-btn:hover {
    background: transparent !important;
    color: #ffffff !important;
    opacity: 0.6 !important;
}

/* Copy button */
.copy-btn:hover {
    color: #ffffff !important;
}

/* Image hover */
.msg img:hover {
    transform: none !important;
    box-shadow: none !important;
}

/* Lightbox button */
.lightbox-btn:hover {
    background: rgba(255, 255, 255, 0.10) !important;
    transform: none !important;
}

/* Primary buttons */
.btn-primary:hover {
    transform: none !important;
    box-shadow: none !important;
}

/* ---------------------------------------------------------
   6. VISIBLE BLACK CHAT PAGE SLIDER / SCROLLBAR
   --------------------------------------------------------- */

/* Allow scrollbar to actually exist */
#chat-window {
    overflow-y: scroll !important;

    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: #050505 rgba(0, 0, 0, 0.65);
}

/* Chrome / Edge / Chromium */
#chat-window::-webkit-scrollbar {
    display: block !important;
    width: 9px;
}

/* Black scrollbar track */
#chat-window::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.70);
    border-radius: 20px;
}

/* Black scrollbar handle */
#chat-window::-webkit-scrollbar-thumb {
    background: #050505;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    min-height: 45px;
}

/* DO NOT change color when mouse is over slider */
#chat-window::-webkit-scrollbar-thumb:hover {
    background: #050505 !important;
    border-color: rgba(255, 255, 255, 0.12) !important;
}

/* ---------------------------------------------------------
   7. ALSO GIVE WEB SEARCH RESULTS A BLACK SLIDER
   --------------------------------------------------------- */

.web-results-list {
    scrollbar-width: thin;
    scrollbar-color: #050505 rgba(0, 0, 0, 0.65);
}

.web-results-list::-webkit-scrollbar {
    display: block !important;
    width: 8px;
}

.web-results-list::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.70);
    border-radius: 20px;
}

.web-results-list::-webkit-scrollbar-thumb {
    background: #050505 !important;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
}

.web-results-list::-webkit-scrollbar-thumb:hover {
    background: #050505 !important;
}

/* ---------------------------------------------------------
   8. SIDEBAR SLIDER
   --------------------------------------------------------- */

#history-list {
    scrollbar-width: thin;
    scrollbar-color: #050505 rgba(0, 0, 0, 0.65);
}

#history-list::-webkit-scrollbar {
    display: block !important;
    width: 8px;
}

#history-list::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.70);
}

#history-list::-webkit-scrollbar-thumb {
    background: #050505 !important;
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 20px;
}

#history-list::-webkit-scrollbar-thumb:hover {
    background: #050505 !important;
}

/* ---------------------------------------------------------
   9. INPUT TEXT
   --------------------------------------------------------- */

#user-input {
    color: #ffffff !important;
}

#user-input::placeholder {
    color: rgba(255, 255, 255, 0.60) !important;
}

/* ---------------------------------------------------------
   10. KEEP DARKNOVAX LOGO WHITE
   --------------------------------------------------------- */

.splash-logo,
.logo svg,
.logo,
header svg {
    color: #ffffff;
}

/* Don't let generic hover rules recolor the logo */
.logo:hover,
.logo svg:hover {
    color: #ffffff !important;
}

                <p style="opacity: 0.72; font-size: 1.05rem; line-height: 1.7; max-width: 560px;">     <strong>DarkNovaX</strong> is a free AI chatbot     <strong>Developed By Abuzar Taif</strong>,     built to chat naturally, generate images, search the web,     and read responses aloud — all in one place. </p>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:15px; width:min(500px, 100%); margin-top:10px;">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>

        function showWelcomeScreen() {

        // Init App
        window.addEventListener('load', () => {
            applySettings();
            setTimeout(() => {

            renderHistory();

            // Custom Markdown Renderer for Code Blocks (Adding Copy Button)
            const renderer = new marked.Renderer();

                return `<img src="${href}" alt="" onclick="openLightbox('${href}')">`;

            renderer.code = function(code, language) {

                return `
                    <div class="code-wrapper">

        // Lightbox Logic
        function openLightbox(src) {

        async function downloadLightboxImage() {

        // Utilities
        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

        function toggleSidebar() { 
            document.body.classList.toggle('sidebar-open');

        // Settings & Theme
        function toggleSettings() { 
            const overlay = document.getElementById('settings-overlay');
            overlay.classList.toggle('active'); 
            if(overlay.classList.contains('active')) {
                try {
                    google.accounts.id.renderButton(document.querySelector(".g_id_signin"), { theme: "filled_black", size: "large", width: "100%" });
                } catch(e) {}
            }
        }
        function applySettings() {
            document.getElementById('sett-autospeak').checked = !!userSettings.autoSpeak;
            document.getElementById('sett-entersend').checked = userSettings.enterSend !== false;
            document.getElementById('sett-websearch').checked = userSettings.webSearch !== false;
        }
        function saveSettings() {
            userSettings.autoSpeak = document.getElementById('sett-autospeak').checked;
            userSettings.enterSend = document.getElementById('sett-entersend').checked;
            userSettings.webSearch = document.getElementById('sett-websearch').checked;

        // Feature: Clear Context
        function clearContext() {
            currentContext = [];
            addMessage("Context cleared. I am ready for a new topic.", 'assistant');
        }

        // Feature: Export Chat
        function exportChat() {
            if(!currentId || isPrivate) return alert("No active saved session to export.");
            const s = sessions.find(x => x.id === currentId);
            let content = `# Chat Export: ${s.title}\n\n`;
            s.messages.forEach(m => content += `### ${m.role.toUpperCase()}:\n${m.content}\n\n`);
            const blob = new Blob([content], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);

            a.href = url; a.download = `DarkNovaX_${s.title.replace(/\s/g,'_')}.md`;

        }

        // Feature: Text to Speech
        function speakText(btn, text) {
            if(window.speechSynthesis.speaking) return window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        // History & Search
        function renderHistory(query = "") {
            const list = document.getElementById('history-list');
            const filtered = sessions.filter(s => s.title.toLowerCase().includes(query.toLowerCase()));
            list.innerHTML = filtered.map(s => `
                <div class="history-item ${s.id === currentId && !isPrivate ? 'active' : ''}" onclick="loadSession(${s.id})">
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:85%;">${s.title}</span>
                    <button class="icon-btn delete-btn" onclick="event.stopPropagation(); deleteSess(${s.id})" style="padding:0; width:auto; height:auto;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>

            `).join('');
        }
        function filterHistory() { renderHistory(document.getElementById('search-history').value); }
        function save() { localStorage.setItem('nova_v6_sessions', JSON.stringify(sessions)); }
        function createNewChat() {
            // Stop anything mid-flight, then reset to a blank conversation without reloading the page.
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            if (isRecording) stopMic();
            currentId = null;
            isPrivate = false;
            currentContext = [];
            privateMsgs = [];
            const pi = document.getElementById('private-indicator');
            pi.textContent = "InPrivate Chat";
            pi.style.borderColor = "var(--glass-border)";
            pi.style.color = "white";
            document.getElementById('user-input').value = "";
            fileObj = null;
            document.getElementById('file-chip').style.display = 'none';
            showWelcomeScreen();
            renderHistory();
            if (window.innerWidth < 768 && document.body.classList.contains('sidebar-open')) toggleSidebar();
        }
        function loadSession(id) {
            isPrivate = false;
            document.getElementById('private-indicator').style.borderColor = "var(--glass-border)";
            document.getElementById('private-indicator').style.color = "white";
            
            currentId = id;
            const s = sessions.find(x => x.id === id);
            currentContext = [...s.messages];
            document.getElementById('chat-window').innerHTML = "";
            s.messages.forEach(m => addMessage(m.content, m.role, false));
            renderHistory();
            if(window.innerWidth < 768) toggleSidebar();
        }
        function deleteSess(id) {
            sessions = sessions.filter(s => s.id !== id);
            save(); renderHistory();
            if(currentId === id) createNewChat();
        }
        function clearAll() { if(confirm("Initiate total memory wipe?")) { localStorage.clear(); location.reload(); } }

        // Privacy Mode
        function togglePrivate() {
            isPrivate = !isPrivate;
            const btn = document.getElementById('private-indicator');
            btn.textContent = isPrivate ? "Exit Private" : "InPrivate Chat";
            btn.style.borderColor = isPrivate ? "#ff3b30" : "var(--glass-border)";

            document.getElementById('chat-window').innerHTML = "";

            addMessage(isPrivate ? "InPrivate Mode Active. Conversation is not saved." : "Private Mode Disabled.", 'assistant');

        // UI Helpers
        function fillPrompt(t) { document.getElementById('user-input').value = t; }
        
        function addMessage(text, role, animate = true) {
            const welcome = document.getElementById('welcome-screen');
            if(welcome) welcome.remove();

            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `msg glass ${role === 'user' ? 'msg-user' : 'msg-bot'}`;
            if(!animate) div.style.animation = 'none';
            
            if(role === 'assistant') {
                div.innerHTML = marked.parse(text);
                // Action Buttons for Bot
                const actions = document.createElement('div');
                actions.className = "msg-actions";
                actions.innerHTML = `
                    <div class="action-icon" title="Read Aloud" onclick="speakText(this, \`${text.replace(/`/g, "'").replace(/"/g, "&quot;")}\`)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </div>
                    <div class="action-icon" title="Regenerate" onclick="regenerateLast()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    </div>
                `;
                if(text) div.appendChild(actions);
            } else {
                div.textContent = text;
            }
            
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
            return div;
        }

        function regenerateLast() {
            if(currentContext.length < 2) return;
            // Pop bot
            if(currentContext[currentContext.length-1].role === 'assistant') currentContext.pop();
            // Pop user
            const lastUser = currentContext.pop();
            
            // Remove from DOM
            const win = document.getElementById('chat-window');
            if(win.children.length >= 2) {
                win.removeChild(win.lastChild);
                win.removeChild(win.lastChild);
            }
            
            document.getElementById('user-input').value = lastUser.content;
            handleSend();
        }

        // Main Send Logic
        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text && !fileObj) return;

            let prompt = text;
            let displayText = text;
            const attachedFile = fileObj;
            if(attachedFile) {
                prompt = `[FILE: ${attachedFile.name}]\n${attachedFile.content}\n\nUSER: ${text || "Please analyze this file."}`;
                displayText = `📎 ${attachedFile.name}${text ? '\n' + text : ''}`;
                fileObj = null;
                document.getElementById('file-chip').style.display = 'none';
            }

            // Initialization logic
            if (!isPrivate && !currentId) {
                currentId = Date.now();
                sessions.unshift({ id: currentId, title: text     .replace(/^(search|lookup)\s+/i, "")     .trim()     .slice(0, 40) || (attachedFile ? attachedFile.name : "New Session"), messages: [] });
                currentContext = [{ role: 'system', content: SYSTEM_PROMPT }];
            }

            addMessage(displayText, 'user');
            input.value = "";
            currentContext.push({ role: 'user', content: prompt });
            
            // Sync to storage arrays
            let storageMsgs = isPrivate ? privateMsgs : sessions.find(s => s.id === currentId).messages;
            storageMsgs.push({ role: 'user', content: displayText });

            const botDiv = addMessage('', 'assistant');
            botDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

            // Feature: Image Generation Interception
            const lower = text.toLowerCase();
            if((lower.includes("create") || lower.includes("generate")) && lower.includes("image")) {
                const imgPrompt = encodeURIComponent(text);
                const seed = Math.floor(Math.random() * 1000000);
                const imgUrl = `https://image.pollinations.ai/prompt/${imgPrompt}?width=512&height=512&seed=${seed}`;
                const imgId = `img-${seed}`;
                const wrapperId = `wrap-${seed}`;

                // Inject skeleton with img tag inside (display:none until loaded)
                botDiv.innerHTML = `
                    <p id="p-${seed}" style="margin-bottom:12px; opacity:0.7;">Generating your image...</p>
                    <div id="${wrapperId}" class="skeleton-box" style="overflow:hidden;">
                        <img id="${imgId}" src="${imgUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px;color:transparent;cursor:pointer;display:none;">
                    </div>
                `;

                // Wire up onload via JS (avoids broken inline attribute parsing)
                const imgEl = document.getElementById(imgId);
                const wrapEl = document.getElementById(wrapperId);
                const paraEl = document.getElementById(`p-${seed}`);

                // Placeholder saved immediately so the entry exists even if the tab closes mid-generation
                let historyContent = `_Generating image for "${text}"..._`;
                currentContext.push({ role: 'assistant', content: `[Image generated for: "${text}"]` });
                storageMsgs.push({ role: 'assistant', content: historyContent });
                const storedIndex = storageMsgs.length - 1;

                if (imgEl) {
                    imgEl.onload = function() {
                        if (wrapEl) {
                            wrapEl.style.background = 'none';
                            wrapEl.style.animation = 'none';
                            wrapEl.style.border = '1px solid rgba(255,255,255,0.08)';
                        }
                        imgEl.style.display = 'block';
                        imgEl.onclick = () => openLightbox(imgEl.src);
                        if (paraEl) paraEl.textContent = 'Here is your image:';
                        document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;

                        // Persist the real image so it's still there after a reload — this is the
                        // fix for generated images disappearing on refresh. The image itself lives
                        // on pollinations.ai's server; we just keep the link + markdown around.
                        const finalContent = `Here is your image:\n\n![${text.replace(/[\[\]]/g, '')}](${imgUrl})`;
                        if (!isPrivate) {
                            storageMsgs[storedIndex].content = finalContent;
                            save(); renderHistory();
                        } else {
                            storageMsgs[storedIndex].content = finalContent;
                        }
                    };
                    imgEl.onerror = function() {
                        // Retry without extra params — simplest fallback
                        if (!imgEl.dataset.retried) {
                            imgEl.dataset.retried = "1";
                            imgEl.src = `https://image.pollinations.ai/prompt/${imgPrompt}`;
                        } else {
                            botDiv.innerHTML = `<p style="opacity:0.7;">Could not generate image. Check your internet connection and try again.</p>`;
                            storageMsgs[storedIndex].content = "Image generation failed.";
                            if (!isPrivate) save();
                        }
                    };
                }

                // Action buttons below the skeleton
                const actions = document.createElement('div');
                actions.className = "msg-actions";
                actions.innerHTML = `
                    <div class="action-icon" title="Download" onclick="downloadLightboxImage2('${imgUrl}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </div>
                    <div class="action-icon" title="Regenerate" onclick="regenerateLast()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    </div>
                `;
                botDiv.appendChild(actions);
                document.getElementById("chat-window").scrollTop = document.getElementById("chat-window").scrollHeight;
                if (!isPrivate) { save(); renderHistory(); }

                return;
            }

            // Real Web Search
            if (
                lower.startsWith("search ") ||
                lower.startsWith("lookup ")
            ) {
                const query = text
                    .replace(/^(search|lookup)\s+/i, "")
                    .trim();

                if (!query) {
                    botDiv.textContent = "Please enter something to search for.";
                    return;
                }

                try {
                    botDiv.innerHTML = `
                        <div class="web-search-loading">
                            <div class="web-search-dot"></div>
                            <div class="web-search-dot"></div>
                            <div class="web-search-dot"></div>
                            <span>Searching the web...</span>
                        </div>
                    `;

                    const results = await performWebSearch(query);

                    if (!results.length) {
                        botDiv.textContent =
                            `No web results found for "${query}".`;
                        return;
                    }

                    const resultsHtml = results.map((r, i) => {
                        let domain = r.url;
                        try { domain = new URL(r.url).hostname; } catch (e) {}
                        return `
                            <div class="web-result">
                                <div class="web-result-top">
                                    <div class="web-result-number">${i + 1}</div>
                                    <div class="web-result-content">
                                        <a class="web-result-title" href="${r.url}" target="_blank" rel="noopener noreferrer">${r.title || r.url}</a>
                                        <div class="web-result-domain">${domain}</div>
                                        <div class="web-result-description">${r.snippet || r.description || ''}</div>
                                        <a class="web-result-open" href="${r.url}" target="_blank" rel="noopener noreferrer">Open ↗</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    botDiv.innerHTML = `
                        <div class="web-results">
                            <div class="web-results-header">
                                <div>
                                    <div class="web-results-title">Results for "${query}"</div>
                                    <div class="web-results-subtitle">${results.length} result${results.length === 1 ? '' : 's'} found</div>
                                </div>
                            </div>
                            <div class="web-results-list">${resultsHtml}</div>
                        </div>
                    `;

                    const markdown = results.map((r, i) => `${i + 1}. [${r.title || r.url}](${r.url})\n   ${r.snippet || r.description || ''}`).join('\n\n');

                    currentContext.push({ role: 'assistant', content: `[Web search results for "${query}"]\n${markdown}` });
                    storageMsgs.push({
                        role: "assistant",
                        content: markdown
                    });

                    if (!isPrivate) {
                        save();
                        renderHistory();
                    }

                } catch (error) {
                    console.error("Web search error:", error);

                    botDiv.textContent =
                        "Web search failed. Please try again.";
                }

                return;
            }

            // Standard API Call
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json", "HTTP-Referer": "https://darknovax.vercel.app" },
                    body: JSON.stringify({ model: MODEL, messages: currentContext, stream: true })
                });

                if(!res.ok) throw new Error((await res.json()).error.message || "API Error");

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                botDiv.innerHTML = "";

                while(true) {
                    const { done, value } = await reader.read();
                    if(done) break;
                    const lines = decoder.decode(value).split('\n');
                    for(const line of lines) {
                        if(line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if(data === '[DONE]') continue;
                            try {
                                fullText += JSON.parse(data).choices[0].delta.content || "";
                                botDiv.innerHTML = marked.parse(fullText);
                            } catch(e){}
                        }
                    }
                    document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
                }

                currentContext.push({ role: 'assistant', content: fullText });
                storageMsgs.push({ role: 'assistant', content: fullText });
                if(!isPrivate) { save(); renderHistory(); }

                // Append actions to finished response
                const actions = document.createElement('div');
                actions.className = "msg-actions";
                actions.innerHTML = `
                    <div class="action-icon" title="Read Aloud" onclick="speakText(this, \`${fullText.replace(/`/g, "'").replace(/"/g, "&quot;")}\`)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </div>
                    <div class="action-icon" title="Regenerate" onclick="regenerateLast()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    </div>
                `;
                botDiv.appendChild(actions);

            } catch (err) {
                botDiv.innerHTML = `<strong>CRITICAL ERROR:</strong> ${err.message}`;
            }
        }

        // Inputs
        document.getElementById('user-input').addEventListener('keypress', e => {
            if (e.key === 'Enter' && userSettings.enterSend !== false) handleSend();
        });
        const READABLE_EXT = ['.txt', '.md', '.csv', '.json', '.js', '.ts', '.py', '.html', '.css', '.xml', '.yml', '.yaml', '.log'];
        const MAX_FILE_CHARS = 12000; // keep the prompt within a safe size for the model

        function handleFile(e) {
            const file = e.target.files[0];
            e.target.value = ""; // allow re-selecting the same file later
            if (!file) return;

            const nameLower = file.name.toLowerCase();
            const isTextType = (file.type && file.type.startsWith('text/')) || file.type === 'application/json';
            const isReadableExt = READABLE_EXT.some(ext => nameLower.endsWith(ext));

            if (!isTextType && !isReadableExt) {
                alert(`"${file.name}" can't be read as text (e.g. images/PDFs aren't supported yet), so it won't be analyzed. Try a .txt, .md, .csv, .json or code file instead.`);
                return;
            }

            const reader = new FileReader();
            const chip = document.getElementById('file-chip');
            chip.style.display = 'block';
            chip.textContent = `Reading ${file.name}...`;

            reader.onload = ev => {
                let content = ev.target.result;
                let truncated = false;
                if (content.length > MAX_FILE_CHARS) {
                    content = content.slice(0, MAX_FILE_CHARS);
                    truncated = true;
                }
                fileObj = { name: file.name, content, truncated };
                chip.textContent = `Attached: ${file.name}${truncated ? ' (truncated to fit)' : ''}`;
            };
            reader.onerror = () => {
                alert(`Couldn't read "${file.name}".`);
                chip.style.display = 'none';
                fileObj = null;
            };
            reader.readAsText(file);
        }
        // Voice input: dictates into the text box only — just like ChatGPT/Gemini's mic.
        // It never sends the message for you; you still review and hit send yourself.
        let micManualStop = false;

        function handleMic() {
            if (isRecording) { stopMic(); return; }

            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Speech) return alert("Voice input isn't supported in this browser. Try Chrome or Edge.");

            const btn = document.getElementById('mic-trigger');
            const input = document.getElementById('user-input');
            let committed = input.value ? input.value + ' ' : '';
            micManualStop = false;

            const startRecognition = () => {
                recognition = new Speech();
                recognition.lang = navigator.language || 'en-US';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.title = "Stop listening";
                };

                recognition.onresult = (e) => {
                    let interim = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        const chunk = e.results[i][0].transcript;
                        if (e.results[i].isFinal) committed += chunk + ' ';
                        else interim += chunk;
                    }
                    input.value = committed + interim;
                };

                recognition.onerror = (e) => {
                    // Real, unrecoverable errors: stop for good and tell the user why.
                    if (e.error === 'not-allowed' || e.error === 'audio-capture' || e.error === 'service-not-allowed') {
                        micManualStop = true;
                        alert("Microphone access was blocked. Check this site's microphone permission in your browser settings.");
                    }
                    // Other errors (e.g. "no-speech" after a short pause) are normal —
                    // onend fires right after and we just restart listening below.
                };

                recognition.onend = () => {
                    if (micManualStop) {
                        isRecording = false;
                        btn.classList.remove('recording');
                        btn.title = "Voice Input";
                        recognition = null;
                    } else {
                        // Chrome stops the recognizer on its own after a few seconds of
                        // silence even with continuous:true — restart it seamlessly so a
                        // normal pause between sentences doesn't end the dictation.
                        startRecognition();
                    }
                };

                recognition.start();
            };

            startRecognition();
        }

        function stopMic() {
            micManualStop = true;
            if (recognition) { try { recognition.stop(); } catch (e) {} }
            isRecording = false;
            const btn = document.getElementById('mic-trigger');
            if (btn) { btn.classList.remove('recording'); btn.title = "Voice Input"; }
        }

        // Google Auth
        function onGoogle(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            localStorage.setItem("nova_profile", JSON.stringify(data));
            showProfile(data);
            toggleSettings();
            addMessage(`Welcome back, ${data.name}!`, "assistant");
        }
        function showProfile(user){
            document.getElementById("google-login").style.display="none";
            document.getElementById("google-profile").style.display="block";
            document.getElementById("google-avatar").src=user.picture;
            document.getElementById("google-name").textContent=user.name;
        }
        function logoutGoogle(){
            localStorage.removeItem("nova_profile");
            document.getElementById("google-profile").style.display="none";
            document.getElementById("google-login").style.display="flex";
        }

    </script>
    <script src="search.js"></script>
</body>
</html>
